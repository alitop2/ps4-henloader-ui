<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PS4 HenLoader</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="page">

    <h1>PS4 HenLoader</h1>

    <h2>اختر نظام جهازك</h2>

    <section class="system-buttons">

      <button data-action="hen">
        تشغيل HEN لنظام 12.52
      </button>

      <button data-action="payload">
        Payloads
      </button>

      <button data-action="goldhen">
        GoldHEN
      </button>

      <button data-action="about">
        معلومات النظام
      </button>

      <button data-action="restore">
        استعادة المضيف
      </button>

      <button data-action="reload">
        إعادة تحميل الصفحة
      </button>

    </section>

    <div id="status" class="status">
      واجهة HEN جاهزة — لم يتم تنفيذ أي Payload تلقائياً.
    </div>

    <p class="note">
      هذه واجهة ويب فقط. الأزرار لا تنفذ Jailbreak أو Payloads تلقائياً.
    </p>

  </div>

  <script src="script.js"></script>

</body>
</html>
