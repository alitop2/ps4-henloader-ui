<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PS4 HenLoader Web UI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="logo-wrap">
      <img id="logo" src="images/logo.svg" alt="الشعار">
    </div>
    <h1>PS4 HenLoader</h1>
    <p class="version">واجهة ويب مخصصة — PS4 12.52</p>

    <div id="status" class="status">جاهز</div>

    <section class="buttons">
      <button data-action="hen">تشغيل HEN</button>
      <button data-action="payload">Payloads</button>
      <button data-action="about">معلومات</button>
    </section>

    <p class="note">
      هذه واجهة ويب فقط. الأزرار لا تنفذ Jailbreak أو Payloads تلقائيًا.
    </p>
  </main>
  <script src="script.js"></script>
</body>
</html>
