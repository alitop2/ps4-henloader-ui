<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PS4 HenLoader</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="page">

    <header class="header">
        <h1>PS4 HenLoader</h1>
        <h2>اختر نظام جهازك</h2>
    </header>


    <section class="menu">

        <button class="menu-button" data-action="hen">
            تشغيل HEN لنظام 12.52
        </button>

        <button class="menu-button" data-action="payload">
            Payloads
        </button>

        <button class="menu-button" data-action="goldhen">
            GoldHEN
        </button>

        <button class="menu-button" data-action="info">
            معلومات النظام
        </button>

        <button class="menu-button" data-action="restore">
            استعادة المضيف
        </button>

        <button class="menu-button" data-action="reload">
            إعادة تحميل الصفحة
        </button>

    </section>


    <section class="status-box">

        <div class="status-title">
            <span class="status-dot"></span>

            <span id="status">
                واجهة HEN جاهزة
            </span>
        </div>

        <p>
            هذه واجهة ويب فقط. الأزرار لا تنفذ Jailbreak أو Payloads تلقائياً.
        </p>

    </section>


    <footer class="footer">

        <span class="footer-icon">ⓘ</span>

        <span>
            هذه واجهة ويب فقط، الأزرار لا تنفذ Jailbreak أو Payloads تلقائياً.
        </span>

    </footer>

</main>


<script src="script.js"></script>

</body>
</html>
